name: Release

# Gera todos os instaladores e publica um Release do GitHub com eles.
#   - Versão nova: aumente `version` em backend/pyproject.toml (e nos package.json / app.config.ts) e faça push
#     para main. Se ainda não existe Release "v<versão>", o workflow compila tudo e publica (criando a tag).
#     Pushes sem mudança de versão só rodam a checagem rápida.
#   - Também funciona com tag (git push origin v0.3.0) ou manualmente em Actions → Release → Run workflow
#     (com "publicar" marcado cria o Release; sem ele, os arquivos ficam só em Artifacts).
#
# APK assinado: cadastre em Settings → Secrets and variables → Actions
#   ANDROID_KEYSTORE_BASE64  (base64 do arquivo .jks)   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS                                    ANDROID_KEY_PASSWORD
# Sem esses segredos o APK sai assinado com a chave de debug do modelo do React Native (a mesma em todo build,
# então as atualizações instalam por cima). Ela é pública: para distribuir além do grupo, use uma chave própria.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publicar:
        description: "Publicar um Release com os instaladores (cria a tag da versão)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  versao:
    name: versão a publicar
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      gerar: ${{ steps.v.outputs.gerar }}
      publicar: ${{ steps.v.outputs.publicar }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLICAR_MANUAL: ${{ inputs.publicar }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag="$GITHUB_REF_NAME"; gerar=true; publicar=true
          else
            tag="v$(sed -n 's/^version = "\(.*\)"/\1/p' backend/pyproject.toml | head -n 1)"
            if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
              gerar=true; publicar="${PUBLICAR_MANUAL:-false}"
            elif gh release view "$tag" >/dev/null 2>&1; then
              gerar=false; publicar=false
              echo "Release $tag já existe: nada a fazer (aumente a versão para publicar outro)."
            else
              gerar=true; publicar=true
            fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "gerar=$gerar" >> "$GITHUB_OUTPUT"
          echo "publicar=$publicar" >> "$GITHUB_OUTPUT"
          echo "versão: $tag · gerar: $gerar · publicar: $publicar"

  server:
    name: servidor .deb (${{ matrix.arch }})
    needs: versao
    if: needs.versao.outputs.gerar == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-22.04
          - arch: arm64 # Raspberry Pi 4/5 com sistema de 64 bits
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    # Sem runner ARM disponível, o Release sai mesmo assim (só sem o pacote arm64).
    continue-on-error: ${{ matrix.arch == 'arm64' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: astral-sh/setup-uv@v6
      - name: Python portátil (roda em distros com glibc antiga)
        run: uv python install 3.12
      - name: Gerar pacote
        run: PYTHON="$(uv python find 3.12)" packaging/server/build-deb.sh
      - name: Instalar e testar o pacote
        run: |
          sudo apt-get install -y ./dist/rpgplay-server_*_${{ matrix.arch }}.deb
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8080/health && break; sleep 1; done
          curl -sf http://127.0.0.1:8080/api/v1/discovery
          curl -sf http://127.0.0.1:8080/mestre/ | grep -q '<div id="root">'
      - uses: actions/upload-artifact@v4
        with:
          name: servidor-${{ matrix.arch }}
          path: dist/*.deb

  server-windows:
    name: servidor .exe (Windows)
    needs: versao
    if: needs.versao.outputs.gerar == 'true'
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Gerar o instalador (PyInstaller + NSIS)
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File packaging/windows/build.ps1
      - name: Instalar, rodar e desinstalar no Windows
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File packaging/windows/test-install.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: servidor-windows
          path: dist/RPG-Play-Servidor-Setup-*.exe

  desktop:
    name: programa do Mestre (${{ matrix.os }})
    needs: versao
    if: needs.versao.outputs.gerar == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: dist:win
            files: desktop/release/*.exe
          - os: ubuntu-22.04
            target: dist:linux
            files: desktop/release/*.deb
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm run ${{ matrix.target }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false" # sem certificado de assinatura de código
      - uses: actions/upload-artifact@v4
        with:
          name: mestre-${{ matrix.os }}
          path: ${{ matrix.files }}

  android:
    name: app dos jogadores (APK)
    needs: versao
    if: needs.versao.outputs.gerar == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - run: npx expo prebuild --platform android --clean --no-install
      - name: Compilar APK (release)
        working-directory: mobile/android
        # Só as arquiteturas de celulares de verdade (x86 é para emulador): build mais rápido e APK menor.
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
      - name: Assinar com a chave do projeto
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          APK=android/app/build/outputs/apk/release/app-release.apk
          OUT="$GITHUB_WORKSPACE/RPG-Play-$VERSION.apk"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/rpgplay.jks"
            APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)apksigner
            "$APKSIGNER" sign --ks "$RUNNER_TEMP/rpgplay.jks" --ks-pass env:KEYSTORE_PASSWORD \
              --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASSWORD --out "$OUT" "$APK"
            "$APKSIGNER" verify --print-certs "$OUT" | head -n 3
            rm -f "$RUNNER_TEMP/rpgplay.jks"
          else
            echo "::warning::Sem ANDROID_KEYSTORE_BASE64: APK assinado com a chave de debug (pública) do modelo do React Native."
            cp "$APK" "$OUT"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: RPG-Play-*.apk

  release:
    name: publicar Release
    needs: [versao, server, server-windows, desktop, android]
    if: needs.versao.outputs.publicar == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: instaladores
          merge-multiple: true
      - run: ls -la instaladores
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.versao.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: RPG Play ${{ needs.versao.outputs.tag }}
          files: instaladores/*
          generate_release_notes: true
          body: |
            Instaladores do RPG Play para a rede de casa (veja docs/INSTALACAO.md):
            - `rpgplay-server_*_amd64.deb` / `_arm64.deb`: servidor (PC Linux sempre ligado ou Raspberry Pi 64 bits)
            - `RPG-Play-Servidor-Setup-*.exe`: servidor no Windows (pode ser o próprio PC do Mestre)
            - `RPG-Play-Mestre-Setup-*.exe` / `rpgplay-mestre_*_amd64.deb`: programa do Mestre (Windows / Linux)
            - `RPG-Play-*.apk`: app dos jogadores (Android)
