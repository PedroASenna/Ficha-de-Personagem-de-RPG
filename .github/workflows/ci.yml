name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rpg
          POSTGRES_PASSWORD: rpg
          POSTGRES_DB: rpg
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rpg" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      RPG_DATABASE_URL: postgresql+asyncpg://rpg:rpg@localhost:5432/rpg
      RPG_TEST_DATABASE_URL: postgresql+asyncpg://rpg:rpg@localhost:5432/rpg_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: black --check .
      - name: Migrações no SQLite (modo casa, padrão do .deb)
        env:
          RPG_DATABASE_URL: ""
          RPG_DATA_DIR: /tmp/rpgplay-ci
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
          alembic upgrade head
      - name: Migrações no Postgres (upgrade, check de drift, downgrade e upgrade de novo)
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
          alembic upgrade head
      - name: Testes no SQLite
        env:
          RPG_TEST_DATABASE_URL: ""
        run: pytest -q
      - name: Banco de teste
        run: PGPASSWORD=rpg psql -h localhost -U rpg -d rpg -c "CREATE DATABASE rpg_test"
      - name: Testes no Postgres
        run: pytest -q

  web:
    name: painel do Mestre (web)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm run format:check
      - run: npx tsc -b
      - run: npx eslint .
      - run: npx vitest run
      - run: npx vite build
      - name: Servidor para o teste ponta a ponta
        working-directory: backend
        run: python -m venv .venv && .venv/bin/pip install -e .
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
        env:
          CI: "1"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx eslint .
      - run: npx jest --ci
      - name: Bundle Android (Metro)
        run: npx expo export --platform android --output-dir /tmp/export
