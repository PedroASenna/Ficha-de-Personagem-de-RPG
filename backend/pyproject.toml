[project]
name = "rpg-play-api"
version = "0.3.0"
description = "Servidor RPG Play: fichas, mesas do Mestre, mapas e rolagem de dados em tempo real na rede local"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyjwt>=2.8",
    "argon2-cffi>=23.1",
    "redis>=5.0",
    "pillow>=10.3",
    "python-multipart>=0.0.9",
    "aiosqlite>=0.20",
]

[project.scripts]
rpgplay-server = "app.server_cli:main"

[project.optional-dependencies]
gcp = ["google-cloud-storage>=2.16"]
package = ["pyinstaller>=6.10"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "websockets>=12",
    "ruff>=0.5",
    "black>=24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.black]
line-length = 119
target-version = ["py311"]

[tool.ruff]
line-length = 119
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4"]
ignore = ["E501", "B008"] # E501: black cuida; B008: Depends() em defaults é o padrão do FastAPI

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
