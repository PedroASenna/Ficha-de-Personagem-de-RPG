# Servidor RPG Play em container (alternativa ao pacote .deb).
#   docker compose up -d --build
#   docker compose exec rpgplay python -m app.server_cli info            endereços
#   docker compose exec rpgplay python -m app.server_cli reset-password <usuário>
#
# network_mode: host (Linux) para a descoberta automática funcionar: os celulares procuram o servidor por
# broadcast UDP na porta 47777, que não atravessa a rede interna do Docker. Painel: http://IP:8080/mestre
services:
  rpgplay:
    build: .
    network_mode: host
    restart: unless-stopped
    environment:
      RPG_SERVER_NAME: "Mesa de RPG"
      RPG_PORT: "8080"
      RPG_ALLOW_REGISTRATION: "true"
    volumes:
      - rpgplay-data:/data

volumes:
  rpgplay-data:
